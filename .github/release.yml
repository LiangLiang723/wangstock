changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - github-actions
  categories:
    - title: 新功能
      labels:
        - feature
        - enhancement
    - title: 缺陷修复
      labels:
        - bug
        - fix
    - title: 工程与文档
      labels:
        - chore
        - docs
        - ci
        - refactor
    - title: 其他变更
      labels:
        - "*"
