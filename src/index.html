<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>wangstock</title>
<link rel="stylesheet" href="assets/app.css" />
</head>
<body>
<div id="app">
  <header class="titlebar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <rect width="16" height="16" rx="4" fill="#1b1c21"/>
        <polyline points="3,11 6,8 8,9.2 11,5.4 13,6.6" fill="none" stroke="#5b9dff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>wangstock</span>
    </div>
    <div class="tb-spacer" data-tauri-drag-region></div>
    <div class="tb-feed" id="tbFeed"></div>
    <div class="tb-btns">
      <button class="tb-btn" id="btnMin" title="最小化到托盘">─</button>
      <button class="tb-btn" id="btnMax" title="最大化">▢</button>
      <button class="tb-btn danger" id="btnClose" title="隐藏到托盘">✕</button>
    </div>
  </header>

  <main class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="content">
      <div class="toolbar">
        <div class="crumb">
          <h1 id="crumbTitle">全部自选</h1>
          <span id="crumbSub"></span>
        </div>
        <div class="tools">
          <button class="search-trigger" id="searchTrigger">
            <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.6 10.6L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span>搜索代码 / 名称 / 拼音</span>
            <kbd>Ctrl K</kbd>
          </button>
          <button class="btn primary" id="btnAdd">＋ 添加</button>
          <button class="btn icon" id="btnSettings" title="设置">
            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.4v1.7M8 12.9v1.7M1.4 8h1.7M12.9 8h1.7M3.3 3.3l1.2 1.2M11.5 11.5l1.2 1.2M12.7 3.3l-1.2 1.2M4.5 11.5l-1.2 1.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <div class="thead" id="thead"></div>
      <div class="tbody" id="tbody"></div>
      <div class="detail" id="detail"></div>
    </section>
  </main>

  <footer class="statusbar">
    <span id="statusLeft">就绪</span>
    <span class="sb-right">
      <span id="statusRight"></span>
    </span>
  </footer>
</div>

<div class="overlay" id="overlay"></div>
<div class="menu" id="ctxMenu"></div>
<div class="toast" id="toast"></div>
<div class="modal-host" id="modalHost"></div>

<script src="assets/app.js"></script>
</body>
</html>
