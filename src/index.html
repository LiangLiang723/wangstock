<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>wangstock</title>
<link rel="stylesheet" href="assets/core.css" />
<link rel="stylesheet" href="assets/layout.css" />
<link rel="stylesheet" href="assets/views.css" />
</head>
<body>
<div id="app">
  <header class="titlebar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <span class="dot" data-tauri-drag-region></span>
      <span data-tauri-drag-region>wangstock</span>
      <small data-tauri-drag-region>自选行情</small>
    </div>
    <div class="tb-sep" data-tauri-drag-region></div>
    <div class="tb-feed" id="tbFeed" data-tauri-drag-region></div>
    <div class="tb-spacer" data-tauri-drag-region></div>
    <div class="tb-btns">
      <button class="tb-btn" id="btnMin" title="最小化">─</button>
      <button class="tb-btn" id="btnMax" title="最大化 / 还原">▢</button>
      <button class="tb-btn danger" id="btnClose" title="隐藏到托盘">✕</button>
    </div>
  </header>

  <main class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-scroll" id="sideScroll"></div>
      <div class="side-foot">
        <button class="iconbtn" id="btnPause" title="暂停 / 恢复刷新">⏸</button>
        <span class="grow"></span>
        <button class="iconbtn" id="btnSettings" title="设置">⚙</button>
      </div>
    </aside>

    <section class="content" id="content">
      <div class="workhead">
        <div class="crumb">
          <div class="line">
            <span class="parent" id="crumbParent"></span>
            <h1 id="crumbTitle">全部自选</h1>
          </div>
          <span class="meta" id="crumbMeta">加载中…</span>
        </div>
        <div class="worktools">
          <button class="search-trigger" id="searchTrigger">
            <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.6 10.6L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span>搜索代码 / 名称 / 拼音</span><kbd>Ctrl K</kbd>
          </button>
          <button class="btn primary" id="btnAdd">＋ 添加</button>
          <button class="btn" id="btnView">视图</button>
          <button class="iconbtn" id="btnSplit" title="列表与详情并排">◫</button>
        </div>
      </div>

      <div class="indexbar" id="indexbar"></div>

      <div class="split-pane">
        <div class="list-pane">
          <div class="thead" id="thead"></div>
          <div class="tbody" id="tbody"></div>
        </div>
        <div class="detail-pane" id="detail"></div>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <span class="conn" id="conn"><span class="led" id="led"></span><span id="connText">连接中…</span></span>
    <span id="connAction"></span>
    <span class="right">
      <span id="stSource"></span>
      <span id="stUpdate"></span>
      <span id="stInterval"></span>
      <span id="stCount"></span>
    </span>
  </footer>
</div>

<div class="overlay" id="overlay"></div>
<div class="menu" id="ctxMenu"></div>
<div class="toast" id="toast"></div>
<div class="modal-host" id="modalHost"></div>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
